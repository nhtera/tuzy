version: "2"
linters:
  default: standard
  enable:
    - misspell
    - gocritic
    - revive
  settings:
    errcheck:
      # Printing to a command's output stream: nothing useful to do on failure.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # Test HTTP handlers write to httptest recorders; unchecked writes are noise there.
      - path: _test\.go
        linters: [errcheck]
formatters:
  enable:
    - gofmt
    - goimports
